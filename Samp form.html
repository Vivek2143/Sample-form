<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Spooky Halloween RSVP & Form</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Creepster & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0c0414 100%);
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .font-creepster {
            font-family: 'Creepster', cursive;
            letter-spacing: 2px;
        }
        /* Floating Ghosts Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        /* Glowing pumpkin shadow */
        .pumpkin-glow {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Background Spooky Elements -->
    <div class="absolute top-10 left-10 text-4xl floating opacity-30 select-none pointer-events-none">👻</div>
    <div class="absolute bottom-10 right-10 text-4xl floating opacity-30 select-none pointer-events-none" style="animation-delay: 2s;">🦇</div>
    <div class="absolute top-1/3 right-12 text-3xl floating opacity-25 select-none pointer-events-none" style="animation-delay: 1s;">🕷️</div>

    <div class="w-full max-w-lg bg-zinc-900/90 border border-orange-600/50 rounded-2xl p-8 pumpkin-glow relative z-10 backdrop-blur-md">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <span class="text-5xl inline-block mb-2 floating">🎃</span>
            <h1 class="text-4xl text-orange-500 font-creepster tracking-wider">Happy Halloween</h1>
            <p class="text-zinc-400 text-sm mt-1">Enter if you dare... Submit your soul (details)!</p>
        </div>

        <!-- Hidden iframe to bypass CORS for Google Forms -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showSuccess(); }"></iframe>

        <!-- Form connected to your Google Form -->
        <form id="halloweenForm" 
              action="https://docs.google.com/forms/d/e/1FAIpQLSdmdKKCfM-zyxSARdZjHzKOZkAzOWEykdwyy1cTStLd5R9Z6w/formResponse" 
              method="POST" 
              target="hidden_iframe"
              onsubmit="submitted=true;"
              class="space-y-4">

            <!-- Field 1: Name (Replace entry.XXXXXX with your actual pre-filled entry ID if needed) -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-orange-400 font-semibold mb-1">Your Mortal Name</label>
                <input type="text" name="entry.123456789" required placeholder="e.g. Count Dracula" 
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-zinc-100 focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- Field 2: Email -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-orange-400 font-semibold mb-1">Your Ghostly Email</label>
                <input type="email" name="entry.987654321" required placeholder="dracula@underworld.com" 
                       class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-zinc-100 focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- Field 3: Message / Costume Details -->
            <div>
                <label class="block text-xs uppercase tracking-wider text-orange-400 font-semibold mb-1">What's Your Costume?</label>
                <textarea name="entry.555555555" rows="3" placeholder="Describe your terrifying costume..." 
                          class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-zinc-100 focus:outline-none focus:border-orange-500 transition resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full mt-2 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-zinc-950 font-bold py-3.5 px-6 rounded-lg transition transform active:scale-95 shadow-lg shadow-orange-900/50 cursor-pointer font-creepster text-xl tracking-widest">
                🦇 Summon / Submit Details
            </button>
        </form>

        <!-- Success Message Box (Hidden by default) -->
        <div id="successMessage" class="hidden text-center py-10 space-y-3">
            <div class="text-6xl animate-bounce">🍬</div>
            <h2 class="text-3xl font-creepster text-orange-400">Sacrifice Received!</h2>
            <p class="text-zinc-300 text-sm">Aapki details successfully Google Form / Sheets tak pahunch chuki hain!</p>
            <button onclick="resetForm()" class="mt-4 px-5 py-2 bg-zinc-800 hover:bg-zinc-700 text-orange-400 rounded-lg text-sm transition">
                Send Another Response 🔮
            </button>
        </div>

    </div>

    <!-- Script to handle smooth transition -->
    <script>
        let submitted = false;

        function showSuccess() {
            document.getElementById('halloweenForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        }

        function resetForm() {
            submitted = false;
            document.getElementById('halloweenForm').reset();
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('halloweenForm').classList.remove('hidden');
        }
    </script>
</body>
</html>
